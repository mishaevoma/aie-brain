<!doctype html>
<!-- One frame of the review demo. make_gif.py opens this page once per step: demo.html?step=N -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; height: 540px; background: #161618; overflow: hidden; }
  body { font: 22px/1.45 "SF Mono", Menlo, Consolas, monospace; color: #d4d4d4; padding: 24px 34px; }
  .bar { color: #646464; font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .you { color: #ebebec; border: 1px solid #393639; border-radius: 10px; padding: 10px 16px; margin-bottom: 14px; min-height: 104px; white-space: pre-wrap; }
  .you .who { color: #646464; font-size: 15px; display: block; margin-bottom: 2px; }
  .caret { display: inline-block; width: 11px; height: 23px; background: #7b97aa; vertical-align: -3px; }
  .status { color: #84a59d; font-size: 19px; min-height: 28px; margin-bottom: 10px; }
  h1 { font: 700 29px/1.25 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #ebebec; margin: 0 0 16px; }
  h1 span { color: #7b97aa; }
  .part { display: flex; gap: 14px; margin: 0 0 12px; font-size: 21px; white-space: nowrap; }
  .part b { flex: 0 0 118px; color: #7b97aa; font-weight: 600; }
  .part.new b { color: #fff236; }
  .part p { margin: 0; flex: 1; }
  code { color: #ebebec; background: #26262a; border-radius: 4px; padding: 1px 6px; }
  .out { color: #84a59d; }
  .date { color: #ebebec; border-bottom: 1px solid #7b97aa; }
  .hidden { visibility: hidden; }
  .foot { position: absolute; left: 34px; right: 34px; bottom: 16px; color: #646464; font-size: 15px; display: flex; justify-content: space-between; }
</style>
<body>
<div class="bar"><span id="project"></span><span>coding agent</span></div>
<div class="you"><span class="who">you</span><span id="typed"></span><span class="caret" id="caret"></span></div>
<div class="status" id="status"></div>
<h1 id="title" class="hidden"></h1>
<div id="parts"></div>
<div class="foot"><span id="credit"></span><span>mishaevoma.github.io/aie-brain</span></div>
<script>
  // window.DEMO is written by make_gif.py from finding.json.
  const step = Number(new URLSearchParams(location.search).get("step") || 0);
  const d = window.DEMO;
  const typing = d.typing_steps;                       // steps spent typing the pasted lines
  const firstPart = typing + d.status.length + 1;      // step at which the first part shows
  document.getElementById("project").textContent = d.project;
  document.getElementById("credit").textContent = d.credit;
  const shown = Math.ceil(d.prompt.length * Math.min(step + 1, typing) / typing);
  document.getElementById("typed").textContent = d.prompt.slice(0, shown);
  if (step >= typing) document.getElementById("caret").remove();
  const statusIndex = Math.min(step - typing, d.status.length - 1);
  if (step >= typing) document.getElementById("status").textContent = d.status[statusIndex];
  const title = document.getElementById("title");
  title.innerHTML = d.title;
  if (step >= firstPart - 1) title.classList.remove("hidden");
  d.parts.forEach(([label, html], i) => {
    const row = document.createElement("div");
    row.className = "part" + (step === firstPart + i ? " new" : "") + (step < firstPart + i ? " hidden" : "");
    row.innerHTML = `<b>${label}</b><p>${html}</p>`;
    document.getElementById("parts").appendChild(row);
  });
</script>
</body>
