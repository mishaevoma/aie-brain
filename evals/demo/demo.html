<!doctype html>
<!-- One frame of the review demo. make_gif.py opens this page once per step: demo.html?step=N -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; height: 540px; background: #161618; overflow: hidden; }
  body { font: 20px/1.45 "SF Mono", Menlo, Consolas, monospace; color: #d4d4d4; padding: 20px 34px; --accent: #7b97aa; }
  .rail { display: flex; gap: 10px; height: 32px; margin-bottom: 14px; }
  .rail span { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 11px; border-radius: 6px; color: #55555c; border: 1px solid #2c2c31; }
  .rail span.done { border-color: currentColor; }
  .rail span.on { color: #161618; }
  .rail.all span { color: #ebebec; border-color: #55555c; }
  .you { color: #ebebec; border: 1px solid #393639; border-radius: 10px; padding: 14px 18px; white-space: pre-wrap; font-size: 24px; margin-top: 70px; }
  .you .who { color: #646464; font-size: 16px; display: block; margin-bottom: 4px; }
  .you.small { border: 0; padding: 0; margin: 0 0 20px; font-size: 15px; color: #7a7a80; white-space: nowrap; }
  .you.small .who { display: inline; font-size: 15px; margin-right: 8px; }
  .caret { display: inline-block; width: 12px; height: 26px; background: #7b97aa; vertical-align: -4px; }
  .head { display: flex; align-items: baseline; gap: 16px; }
  .prim { font: 800 54px/1.1 -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  .part { color: #8a8a8a; font-size: 18px; }
  .project { margin-left: auto; color: #8a8a8a; font-size: 17px; }
  h1 { font: 700 31px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #ffffff; margin: 10px 0 22px; min-height: 80px; }
  .row { display: flex; gap: 14px; margin: 0 0 12px; white-space: nowrap; }
  .row > b { flex: 0 0 92px; color: var(--accent); font-weight: 600; }
  .row p { margin: 0; flex: 1; }
  .row p b { color: #ffffff; }
  .row p i { color: #9a9aa0; font-style: normal; }
  code { color: #ebebec; background: #2a2a2f; border-radius: 4px; padding: 1px 7px; }
  .out { color: var(--accent); }
  .hidden { visibility: hidden; }
  .gone { display: none; }
  #end { text-align: center; padding-top: 120px; }
  #end p { font: 700 34px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #ffffff; margin: 0; }
  #end p + p { font-weight: 400; font-size: 25px; color: #d4d4d4; margin-top: 12px; }
  .foot { position: absolute; left: 34px; right: 34px; bottom: 16px; color: #646464; font-size: 15px; display: flex; justify-content: space-between; white-space: nowrap; }
</style>
<body>
<div class="rail" id="rail"></div>
<div class="you" id="you"><span class="who">you, in your coding agent</span><span id="typed"></span><span class="caret" id="caret"></span></div>
<div id="scene" class="gone">
  <div class="head"><span class="prim" id="prim"></span><span class="part" id="part"></span><span class="project" id="project"></span></div>
  <h1 id="gist"></h1>
  <div id="rows"></div>
</div>
<div id="end" class="gone"><p id="end1"></p><p id="end2"></p></div>
<div class="foot"><span id="credit"></span><span id="site">mishaevoma.github.io/aie-brain</span></div>
<script>
  // window.DEMO is written by make_gif.py from showcases.json.
  // Steps: typing_steps of the pasted lines, then two per scene (the primitive and its gist, then the evidence), then the end card.
  const step = Number(new URLSearchParams(location.search).get("step") || 0);
  const d = window.DEMO, typing = d.typing_steps, scenes = d.scenes;
  const k = step - typing, at = Math.floor(k / 2), ended = k >= scenes.length * 2;
  const accent = Object.fromEntries(scenes.map(s => [s.primitive, s.accent]));
  const seen = scenes.slice(0, ended ? scenes.length : Math.max(at, 0)).map(s => s.primitive);
  const rail = document.getElementById("rail");
  if (ended) rail.classList.add("all");
  d.stack.forEach(name => {
    const chip = document.createElement("span");
    chip.textContent = name;
    if (!ended && k >= 0 && scenes[at].primitive === name) { chip.className = "on"; chip.style.background = accent[name]; chip.style.borderColor = accent[name]; }
    else if (seen.includes(name)) { chip.className = "done"; chip.style.color = accent[name]; }
    rail.appendChild(chip);
  });
  const you = document.getElementById("you");
  if (k < 0) {
    const typed = Math.ceil(d.prompt.length * (step + 1) / typing);
    document.getElementById("typed").textContent = d.prompt.slice(0, typed);
  } else {
    document.getElementById("caret").remove();
    you.classList.add("small");
    you.querySelector(".who").textContent = "you ›";
    document.getElementById("typed").textContent = d.prompt.replace("\n", " ");
  }
  if (k >= 0 && !ended) {
    const scene = scenes[at], phase = k % 2;
    document.body.style.setProperty("--accent", scene.accent);
    document.getElementById("prim").textContent = scene.primitive;
    document.getElementById("part").textContent = scene.part;
    document.getElementById("project").textContent = scene.project;
    document.getElementById("gist").textContent = scene.gist;
    document.getElementById("credit").textContent = "evidence from a real review · " + scene.credit;
    document.getElementById("site").remove();  // the address is in the pasted line above
    scene.rows.forEach(([label, html]) => {
      const row = document.createElement("div");
      row.className = "row" + (phase === 0 ? " hidden" : "");
      row.innerHTML = `<b>${label}</b><p>${html}</p>`;
      document.getElementById("rows").appendChild(row);
    });
    document.getElementById("scene").classList.remove("gone");
  } else if (ended) {
    you.classList.add("gone");
    document.getElementById("end").classList.remove("gone");
    document.getElementById("end1").textContent = d.end[0];
    document.getElementById("end2").textContent = d.end[1];
  }
</script>
</body>
